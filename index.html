<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>高速公路塞不塞</title>
<style>
/* Layout: 單欄手機優先；頂部為國道綠底告示牌，下方查詢表單（快速選城市＋進階細項輸入）、路線結果卡、沿線全部公路列表 */
:root{
  --bg:#eef2ee;--surface:#ffffff;--surface2:#f4f7f4;--fg:#15221a;--dim:#5b6b60;--line:#d3ddd5;
  --sign:#0a6b3c;--sign-fg:#ffffff;--accent:#0a6b3c;--accent-fg:#ffffff;
  --ok:#14804a;--ok-bg:#dcf3e5;--mid:#9a6a00;--mid-bg:#fff0c6;--bad:#c7293a;--bad-bg:#fde0e3;
  --cam:#18201b;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c130f;--surface:#141d17;--surface2:#1a251e;--fg:#e4eee7;--dim:#93a79a;--line:#2a3a30;
  --sign:#0d7a45;--accent:#35c27a;--accent-fg:#04140b;
  --ok:#47d58b;--ok-bg:#12351f;--mid:#f0bf3c;--mid-bg:#3a3010;--bad:#ff7280;--bad-bg:#431a20;
  --cam:#0a0f0c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c130f;--surface:#141d17;--surface2:#1a251e;--fg:#e4eee7;--dim:#93a79a;--line:#2a3a30;
  --sign:#0d7a45;--accent:#35c27a;--accent-fg:#04140b;
  --ok:#47d58b;--ok-bg:#12351f;--mid:#f0bf3c;--mid-bg:#3a3010;--bad:#ff7280;--bad-bg:#431a20;
  --cam:#0a0f0c;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:760px;margin-inline:auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* 告示牌標題 */
.sign{background:var(--sign);color:var(--sign-fg);border-radius:10px;padding:14px 18px;display:flex;align-items:center;gap:14px;
  border:3px solid #fff;outline:2px solid var(--sign);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.shield{flex:none;width:46px;height:46px;border-radius:8px;background:#fff;color:var(--sign);display:grid;place-items:center;
  font-weight:800;font-size:12px;line-height:1.05;text-align:center;font-family:var(--sans)}
.shield b{display:block;font-size:20px;font-family:var(--mono)}
h1{margin:0;font-size:clamp(20px,5.6vw,30px);letter-spacing:.06em;line-height:1.2;text-wrap:balance}
.sign p{margin:2px 0 0;font-size:12px;letter-spacing:.08em;opacity:.9}
.notice{margin:0;font-size:12.5px;color:var(--dim);background:var(--surface2);border:1px dashed var(--line);border-radius:8px;padding:8px 12px}

/* 表單 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
form{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:end}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--dim);min-width:0}
select,button,input{font:inherit;color:inherit}
select,input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--fg);font-size:16px}
input::placeholder{color:var(--dim);opacity:.8}
select:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.swap{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-size:18px;line-height:1}
.swap:hover{border-color:var(--accent)}
.row2{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}
.go{padding:11px 22px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:16px;letter-spacing:.2em;cursor:pointer}
.go:hover{filter:brightness(1.08)}.go:active{transform:scale(.97)}
@media (max-width:520px){
  form{grid-template-columns:minmax(0,1fr)}
  .swap{justify-self:center;transform:rotate(90deg)}
  .row2{grid-template-columns:minmax(0,1fr)}
  .go{width:100%}
}

/* 進階細項輸入 */
.adv{grid-column:1/-1;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.adv>summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
.adv>summary::-webkit-details-marker{display:none}
.adv>summary::after{content:"＋";color:var(--dim);font-weight:400}
.adv[open]>summary::after{content:"－"}
.adv>summary small{font-weight:400;color:var(--dim);font-size:12px}
.advbody{padding:2px 14px 14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.advbody>p{grid-column:1/-1;margin:0;font-size:12.5px;color:var(--dim)}
.advbody input[type=text]{background:var(--surface)}
.msg{font-size:12.5px;min-height:1.4em;color:var(--dim);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.msg.okm{color:var(--ok)}.msg.err{color:var(--bad)}
.chip{font:inherit;font-size:12.5px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:520px){.advbody{grid-template-columns:minmax(0,1fr)}}

/* 摘要 */
.sum{display:flex;flex-direction:column;gap:10px;border-left:6px solid var(--lv,var(--ok))}
.sum h2{margin:0;font-size:clamp(19px,5.2vw,26px);line-height:1.3}
.sum h2 small{display:block;font-size:12.5px;font-weight:400;color:var(--dim);margin-top:2px}
.sum .meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--dim);font-size:13px}
.sum .big{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.big .t{font-size:clamp(28px,8vw,40px);font-weight:700;font-family:var(--mono)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.mid{background:var(--mid-bg);color:var(--mid)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
h3{margin:4px 0 0;font-size:15px;letter-spacing:.08em;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
h3 small{font-weight:400;color:var(--dim);letter-spacing:0;font-size:12px}

/* 路線卡 */
.routes{display:flex;flex-direction:column;gap:12px}
details.route{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.route[open]{border-color:var(--accent)}
details.route>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center}
details.route>summary::-webkit-details-marker{display:none}
.rank{width:30px;height:30px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px}
.routes>.route:first-child .rank{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.rname{font-weight:700;min-width:0}
.rsub{grid-column:2/4;font-size:12.5px;color:var(--dim)}
.rtime{grid-row:1;grid-column:3;text-align:right;font-weight:700;font-family:var(--mono);white-space:nowrap}
.rpill{grid-row:3;grid-column:2;justify-self:start}
.hops{padding:2px 16px 16px;display:flex;flex-direction:column}
.hop{display:grid;grid-template-columns:14px minmax(0,1fr);gap:0 12px}
.rail{display:flex;flex-direction:column;align-items:center}
.rail i{width:12px;height:12px;border-radius:50%;background:var(--lv);flex:none;margin-top:5px}
.rail u{flex:1;width:4px;background:var(--lv);opacity:.55;border-radius:2px;margin-block:2px}
.hop:last-child .rail u{display:none}
.hbody{padding-bottom:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.hrow{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.seg{font-weight:600}
.badge{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:5px;color:#fff;background:var(--sign);white-space:nowrap;letter-spacing:.04em}
.badge.t{background:#1d5fa8}.badge.l{background:#6b7a70}
.stats{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12.5px;color:var(--dim)}
.stats b{color:var(--fg);font-weight:600}
.desc{margin:0;font-size:12.5px;color:var(--dim)}
.sub{border-top:1px solid var(--line);padding-top:6px}
.sub>summary{cursor:pointer;font-size:12.5px;color:var(--accent);list-style:none}
.sub>summary::-webkit-details-marker{display:none}
.sub>summary::before{content:"▸ "}
.sub[open]>summary::before{content:"▾ "}
.sr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:12.5px;padding-block:4px;border-top:1px dashed var(--line)}
.sr:first-of-type{border-top:0}
.sr .sp{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--dim);white-space:nowrap}

/* 示範攝影機 */
.cam{position:relative;height:50px;border-radius:7px;background:var(--cam);overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:5px;padding-top:8px}
.cam .lane{height:15px;position:relative;overflow:hidden;border-top:1px dashed rgba(255,255,255,.18)}
.cam .lane:first-of-type{border-top:0}
.cam .tr{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;white-space:nowrap;will-change:transform;animation:flow var(--d,12s) linear infinite}
.cam .tr s{display:block;height:11px;border-radius:3px;flex:none;text-decoration:none}
.cam .tag{position:absolute;left:6px;top:2px;font:9px/1 var(--mono);color:rgba(255,255,255,.75);letter-spacing:.06em}
.cam .tag.r{left:auto;right:6px}
@keyframes flow{to{transform:translateX(-50%)}}

/* 沿線公路 */
details.hw{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.hw>summary{cursor:pointer;list-style:none;padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
details.hw>summary::-webkit-details-marker{display:none}
details.hw>summary .grow{flex:1;min-width:0;font-size:12.5px;color:var(--dim)}
.hwbody{padding:0 16px 12px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:13.5px;padding-block:5px;border-top:1px solid var(--line)}
.srow .sp{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--dim);text-align:right}
.foot{font-size:12px;color:var(--dim);line-height:1.7}
.foot code{font-family:var(--mono);background:var(--surface2);padding:0 5px;border-radius:4px}
@media (prefers-reduced-motion:reduce){.cam .tr{animation-duration:200s}}
</style>
</head>

        <button class="go" type="submit">查詢</button>
      </div>
    </form>
  </section>

  <div id="out" aria-live="polite"></div>

  <p class="foot" id="foot"></p>
</div>

/* ===== 示範路況模型 ===== */
function hashSeed(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const g=(h,mu,sd)=>Math.exp(-((h-mu)**2)/(2*sd*sd));
function scenario(key){
  const d=new Date();
  if(key==='am')return{h:8,dow:2,label:'平日早上 8:00 尖峰',d};
  if(key==='pm')return{h:18,dow:2,label:'平日傍晚 18:00 尖峰',d};
  if(key==='hol')return{h:17,dow:0,label:'連假最後一天 17:00',d,hol:true};
  if(key==='night')return{h:2,dow:2,label:'深夜 2:00',d};
  return{h:d.getHours()+d.getMinutes()/60,dow:d.getDay(),label:'現在時間',d};
}
function snapshot(e,north,sc){
  const h=sc.h,wk=sc.dow>=1&&sc.dow<=5&&!sc.hol;
  let load=.08;
  if(wk){
    load+=g(h,8,1.1)*(north?.62:.42)+g(h,18,1.4)*(north?.72:.85)+g(h,12.5,2)*.12;
    if(e.urban)load+=.08*(g(h,8,1.5)+g(h,18,1.6));
  }else if(sc.dow===6){
    load+=g(h,10,2)*(north?.15:.38)+g(h,15,2)*.1;
  }else{
    load+=g(h,17,2.6)*(north?(sc.hol?1.0:.5):.2)+g(h,9,1.8)*(north?.05:.2);
  }
  if(e.hw==='國道5號'&&!wk&&((sc.dow===6&&!north)||(sc.dow!==6&&north)))load+=.28;
  if(e.kind!=='hw')load=load*.6+.05;
  load+=e.bias;
  const k=sc.d,bucket=`${k.getFullYear()}${k.getMonth()}${k.getDate()}${Math.floor(sc.h*4)}`;
  load=clamp(load+(rng(hashSeed(e.id+north+bucket))()-.5)*.16,0,1);
  const speed=Math.max(Math.round(e.free*.2),Math.round(e.free*(1-.72*Math.pow(load,1.4))));
  const ratio=speed/e.free;
  return{speed,ratio,lv:ratio>.75?'ok':ratio>.45?'mid':'bad',load,flow:Math.round(60+load*190+rng(hashSeed(e.id+bucket))()*20),min:e.km/speed*60,free:e.km/e.free*60};
}
/* 資料層：之後換成 TDX 即時路況時，只要改這個函式。回傳一個 (邊, 方向) → 路況 的查詢函式 */
async function fetchSnapshots(edges,sc){
  const m=new Map();
  edges.forEach(e=>[true,false].forEach(n=>m.set(e.id+n,snapshot(e,n,sc))));
  return(e,north)=>m.get(e.id+north);
}

const lvOf=r=>r>.75?'ok':r>.45?'mid':'bad';

/* ===== 路線搜尋 ===== */
function dijkstraKm(dst){
  const dist=new Map([[dst,0]]),done=new Set();
  for(;;){
    let best=null,bd=Infinity;
    dist.forEach((d,k)=>{if(!done.has(k)&&d<bd){bd=d;best=k}});
    if(best===null)break;
    done.add(best);
    for(const {e,to} of ADJ.get(best)){const nd=bd+e.km;if(nd<(dist.get(to)??Infinity))dist.set(to,nd)}
  }
  return dist;
}
function enumerate(src,dst){
  const dist=dijkstraKm(dst),base=dist.get(src);
  if(base==null)return{paths:[],base:0};
  const limit=base*1.35+25,paths=[],seen=new Set([src]),es=[],ns=[src];let steps=0;
  (function dfs(node,km,lastHw,sw,left){
    if(paths.length>=3000||++steps>600000)return;
    if(node===dst){paths.push({edges:es.slice(),nodes:ns.slice(),km});return}
    for(const {e,to} of ADJ.get(node)){
      if(seen.has(to))continue;
      if(km+e.km+(dist.get(to)??Infinity)>limit)continue;
      const nd=NODES.get(to);
      if(nd.kind==='poi'&&to!==dst)continue;
      let lh=lastHw,s=sw,lf=left;
      if(e.kind==='hw'){
        if(left===e.hw)continue;
        if(lh&&lh!==e.hw){s++;if(s>2)continue}
        lh=e.hw;lf=null;
      }else if(e.kind==='local'&&lh){lf=lh}
      seen.add(to);es.push(e);ns.push(to);
      dfs(to,km+e.km,lh,s,lf);
      seen.delete(to);es.pop();ns.pop();
    }
  })(src,0,null,0,null);
  return{paths,base};
}
function fmtMin(m){m=Math.round(m);const h=Math.floor(m/60);return h?`${h} 小時 ${m%60} 分`:`${m} 分`}
const dirLabel=(hw,n)=>hw==='國道5號'?(n?'往台北':'往宜蘭'):(n?'北上':'南下');

function buildRoute(p,snap){
  const hops=p.edges.map((e,i)=>{
    const from=NODES.get(p.nodes[i]),to=NODES.get(p.nodes[i+1]),north=e.kind==='hw'?(p.nodes[i+1]===e.a):true;
    return{e,from,to,north,...snap(e,north)};
  });
  const groups=[];
  hops.forEach(h=>{
    const key=h.e.kind==='hw'?h.e.hw:'接駁',last=groups[groups.length-1];
    if(last&&last.key===key)last.hops.push(h);else groups.push({key,hops:[h]});
  });
  groups.forEach(gp=>{
    const hs=gp.hops;
    gp.km=hs.reduce((s,h)=>s+h.e.km,0);gp.min=hs.reduce((s,h)=>s+h.min,0);gp.freeMin=hs.reduce((s,h)=>s+h.free,0);
    gp.speed=Math.round(gp.km/gp.min*60);gp.ratio=gp.freeMin/gp.min;gp.lv=lvOf(gp.ratio);
    gp.worst=hs.reduce((w,h)=>h.ratio<w.ratio?h:w);
    gp.from=hs[0].from;gp.to=hs[hs.length-1].to;gp.north=hs[0].north;gp.isHw=gp.key!=='接駁';
  });
  const min=hops.reduce((s,h)=>s+h.min,0),free=hops.reduce((s,h)=>s+h.free,0),km=hops.reduce((s,h)=>s+h.e.km,0);
  const hws=groups.filter(x=>x.isHw).map(x=>x.key);
  return{groups,hops,min,free,km,ratio:free/min,lv:lvOf(free/min),hws,sig:hws.join('>')||'local'};
}
async function plan(src,dst,sc){
  const {paths,base}=enumerate(src,dst);
  if(!paths.length)return{list:[],union:[],base};
  const used=new Map();paths.forEach(p=>p.edges.forEach(e=>used.set(e.id,e)));
  const snap=await fetchSnapshots([...used.values()],sc);
  const best=new Map();
  paths.forEach(p=>{const r=buildRoute(p,snap);const o=best.get(r.sig);if(!o||r.min<o.min)best.set(r.sig,r)});
  const list=[...best.values()].sort((a,b)=>a.min-b.min).slice(0,4);
  const byHw={};
  used.forEach(e=>{if(e.kind==='hw')(byHw[e.hw]=byHw[e.hw]||[]).push(e)});
  Object.values(byHw).forEach(a=>a.sort((x,y)=>NODES.get(x.a).km-NODES.get(y.a).km));
  return{list,byHw,snap,base,count:paths.length};
}

function resolve(text){
  const q=norm(text);
  if(!q)return{status:'empty'};
  const exact=PLACES.filter(p=>p.keys.includes(q)).sort((a,b)=>a.rank-b.rank);
  if(exact.length)return{status:'ok',place:exact[0],alt:exact.slice(1,5)};
  const part=PLACES.filter(p=>p.keys.some(k=>k.includes(q)||(k.length>=2&&q.includes(k)))).sort((a,b)=>a.rank-b.rank);
  if(part.length===1)return{status:'ok',place:part[0],alt:[]};
  if(part.length>1)return{status:'many',list:part.slice(0,8)};
  return{status:'none'};
}

const hops1=gp=>gp.hops.length>1;
function routeHTML(r,i){
  const delay=Math.max(0,Math.round(r.min-r.free));
  const via=r.groups.filter(x=>x.isHw).map(x=>`${x.key}（${short(x.from)}→${short(x.to)}）`).join(' → ');
  return`<details class="route"${i===0?' open':''} data-ri="${i}">
    <summary><span class="rank">${i+1}</span><span class="rname">${routeName(r)}</span><span class="rtime">${fmtMin(r.min)}</span>
      <span class="rsub">${via||'市區道路'}・${r.km} 公里・比順暢多 ${delay} 分</span><span class="rpill pill ${r.lv}">${LV[r.lv]}</span></summary>
    <div class="hops">${r.groups.map((gp,j)=>groupHTML(gp,i,j)).join('')}</div></details>`;
}
function hwListHTML(res){
  return Object.entries(res.byHw).map(([hw,edges])=>{
    const rows=edges.map(e=>{
      const s=res.snap(e,true),t=res.snap(e,false),w=s.ratio<t.ratio?s:t;
      return`<div class="srow"><span>${short(NODES.get(e.a))} ⇄ ${short(NODES.get(e.b))}　<span class="mono" style="color:var(--dim)">${e.km}km</span></span><span class="sp">北 ${s.speed}・南 ${t.speed}</span><span class="pill ${w.lv}">${LV[w.lv]}</span></div>`}).join('');
    const worst=edges.reduce((m,e)=>{const s=res.snap(e,true),t=res.snap(e,false),w=s.ratio<t.ratio?s:t;return w.ratio<m.ratio?w:m},{ratio:9});
    const kmSum=edges.reduce((s,e)=>s+e.km,0),minSum=edges.reduce((s,e)=>s+(res.snap(e,true).min+res.snap(e,false).min)/2,0);
    return`<details class="hw"><summary>${badge(hw)}<span class="pill ${lvOf(worst.ratio)}">最壅塞：${LV[lvOf(worst.ratio)]}</span><span class="grow">${edges.length} 個區間・平均約 ${Math.round(kmSum/minSum*60)} km/h</span></summary><div class="hwbody">${rows}</div></details>`;
  }).join('');
}
let runId=0;
async function run(){
  const id=++runId;
  const so=sidePlace('from'),sd=sidePlace('to');
  ['from','to'].forEach(updateMsg);
  if(so.error||sd.error){
    const bad=so.error?'出發點':'終點';
    out.innerHTML=`<div class="card">${bad}的細項還不能辨識，請從清單選擇，或點上方的建議選項。</div>`;return;
  }
  const a=so.place,b=sd.place;
  if(a.id===b.id){out.innerHTML='<div class="card">出發點與終點相同，請選不同的地點。</div>';return}
  store('jam.from',fromEl.value);store('jam.to',toEl.value);store('jam.scn',scnEl.value);
  store('jam.ff',fineEl.from.value.trim());store('jam.tf',fineEl.to.value.trim());
  const sc=scenario(scnEl.value),res=await plan(a.id,b.id,sc);
  if(id!==runId)return;
  CAMS.clear();
  if(!res.list.length){out.innerHTML='<div class="card">找不到這兩地之間的國道或快速道路。</div>';return}
  const best=res.list[0],d=sc.d;
  const stamp=`${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const detail=(so.fine||sd.fine)?`<small>${so.fine?'出發：'+a.label:''}${so.fine&&sd.fine?'　':''}${sd.fine?'抵達：'+b.label:''}</small>`:'';
  out.innerHTML=`
   <section class="card sum" style="--lv:var(--${best.lv})">
     <h2>${disp(a)} → ${disp(b)}${detail}</h2>
     <div class="big"><span class="t">${fmtMin(best.min)}</span><span class="pill ${best.lv}">${LV[best.lv]}</span></div>
     <div>建議走 <b>${routeName(best)}</b>，約 ${best.km} 公里，順暢時需 ${fmtMin(best.free)}。</div>
     <div class="meta"><span>情境：${sc.label}</span><span>查詢時間 ${stamp}</span><span>示範資料</span></div>
   </section>
   <h3>可走路線 <small>依預估時間排序</small></h3>
   <div class="routes">${res.list.map(routeHTML).join('')}</div>
   <h3 style="margin-top:10px">沿線全部公路 <small>逐個交流道區間，北上與南下時速</small></h3>
   <div class="routes">${hwListHTML(res)}</div>`;
  out.querySelectorAll('details.route').forEach(dt=>{
    if(dt.open)mountCams(dt);
    dt.addEventListener('toggle',()=>{if(dt.open)mountCams(dt)});
  });
}
$('#f').addEventListener('submit',e=>{e.preventDefault();run()});
$('#swap').addEventListener('click',()=>{
  const t=fromEl.value;fromEl.value=toEl.value;toEl.value=t;
  const f=fineEl.from.value;fineEl.from.value=fineEl.to.value;fineEl.to.value=f;run();
});
['from','to'].forEach(side=>{
  selEl[side].addEventListener('change',()=>{fineEl[side].value='';run()});
  fineEl[side].addEventListener('input',()=>updateMsg(side));
  fineEl[side].addEventListener('change',run);
});
scnEl.addEventListener('change',run);
document.addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  fineEl[c.dataset.side].value=c.dataset.v;run();
});

$('#foot').innerHTML='資料說明：本頁的時速與壅塞等級由「查詢當下的時間＋情境＋路段特性」估算，攝影機畫面為 CSS 示意動畫；交流道里程、系統轉乘點與地標接駁距離都是概估值。接上真實資料時，請改寫程式裡的 <code>fetchSnapshots()</code>，改由交通部 TDX 運輸資料流通服務（公路局、高公局的路段即時路況與 CCTV）取得各路段時速與影像網址，其餘畫面不用動。注意：直接從瀏覽器呼叫 TDX 需要金鑰，建議透過自己的後端或代理轉發。';
['from','to'].forEach(updateMsg);
run();
})();
</script>
